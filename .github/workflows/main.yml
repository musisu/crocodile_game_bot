name: Run Telegram Bot

on:
  push:
    branches:
      - master

# === ЦЕЙ БЛОК АВТОМАТИЧНО ВБИВАЄ СТАРОГО БОТА ПРИ НОВОМУ ПУШІ ===
concurrency:
  group: telegram-bot-session
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TOKEN: ${{ secrets.TOKEN }}
        run: python main.py


